<script>
const stages=['Reconocer','Valorar','Riesgos y alarmas','Intervenir','Orientaciones al plan','Seguimiento'];
const refs=['9.1 · pp. 48–51','9.1 y 9.2 · pp. 49–54','9.4 · pp. 58–60','9.2 y 9.3 · pp. 51–58','9.5 · pp. 60–63','9.5 · pp. 62–63'];
const understand=[
['El consumo es un fenómeno individual, familiar y contextual: su daño no se reduce al volumen de alcohol ingerido.','Explore la relación entre sustancia, persona y contexto, conforme al esquema de las pautas basado en la tríada de Zinberg.','Las experiencias, normas y prácticas familiares influyen en el entorno, pero no explican por sí solas el consumo ni trasladan la responsabilidad de cambiar a la familia.','La escucha privada es indispensable cuando existen miedo, violencia o relaciones de control.'],
['La valoración se desarrolla en pasos: comprobar seguridad, explorar brevemente el patrón de consumo, aplicar AUDIT cuando sea pertinente y profundizar según daños, dependencia, contexto y riesgos de terceros.','AUDIT es una herramienta de tamización, no una prueba diagnóstica; su resultado no establece por sí mismo dependencia ni seguridad familiar.','No confunda un puntaje bajo con ausencia de daños: embarazo, conducción, cuidado inseguro, violencia o interacciones farmacológicas requieren decisiones propias.','La valoración debe integrar el patrón de consumo con las condiciones personales, el contexto familiar y la exposición de terceros.'],
['La prioridad corresponde a la seguridad, no al puntaje AUDIT.','Las urgencias, la protección de terceros y la valoración clínica prioritaria son respuestas distintas que pueden coexistir.','La abstinencia en dependencia puede ser peligrosa: no indique suspender bruscamente sin evaluación profesional.','Evite entrevistas conjuntas o confrontaciones cuando existan violencia, miedo o coerción.'],
['La intervención breve no es una charla informativa: comprende retroalimentación personalizada, escucha, consejo explícito, meta escogida por la persona, estrategias y seguimiento; cuenta con mejor respaldo para personas adultas con consumo de riesgo o perjudicial sin dependencia grave.','FRAMES y FLAGS son estructuras de conversación; no escalas ni tratamientos autónomos. Sirven para practicar escucha reflexiva, consejo adaptado y planificación colaborativa sin confrontación.','La evidencia de intervenciones familiares directamente realizadas en el hogar es más limitada: adapte las acciones sin exagerar su efectividad.','Para padres y cuidadores, abordar simultáneamente consumo y responsabilidades de cuidado es más pertinente que intervenir solo uno de ellos.'],
['La familia no es la terapeuta: puede reconocer riesgos, protegerse y facilitar apoyos, pero no debe diagnosticar, controlar el consumo, administrar la abstinencia ni asumir el tratamiento.','Diferencie factores protectores observados de intervenciones que han demostrado poder modificarlos.','La familia no es culpable de la conducta individual de quien consume. Evite reproches, alianzas coercitivas o pedir a niñas y niños que vigilen, escondan bebidas o se hagan responsables de la recuperación.','El riesgo individual debe contribuir al análisis sistémico de vulnerabilidad familiar, sin determinar automáticamente la modalidad PICF.'],
['El seguimiento incluye consumo, daños, seguridad, funcionamiento familiar y acceso efectivo a servicios; el equipo de salud conserva la coordinación clínica y no delega esa tarea a la familia.','La remisión no se completa cuando se entrega una orden: debe verificarse la vinculación al servicio.','El incumplimiento puede expresar dependencia, violencia, barreras sociales y ausencia de apoyos, no únicamente motivación.','Los registros y la programación operativa corresponden a SIBACOM PLUS, evitando el doble diligenciamiento.']
];
const audit=[
['¿Con qué frecuencia consume alguna bebida alcohólica?',['Nunca','Una vez al mes o menos','De 2 a 4 veces al mes','De 2 a 3 veces por semana','4 o más veces por semana']],[ '¿Cuántas bebidas estándar consume habitualmente en un día en que bebe?',['1 o 2','3 o 4','5 o 6','7 a 9','10 o más']],['¿Con qué frecuencia toma seis o más bebidas en una misma ocasión?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['Durante el último año, ¿con qué frecuencia no pudo parar de beber una vez que había comenzado?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['Durante el último año, ¿con qué frecuencia el consumo le impidió cumplir sus obligaciones habituales?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['Durante el último año, ¿con qué frecuencia necesitó beber por la mañana después de haber bebido mucho el día anterior?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['Durante el último año, ¿con qué frecuencia sintió culpa o remordimiento después de beber?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['Durante el último año, ¿con qué frecuencia no pudo recordar lo sucedido la noche anterior por haber bebido?',['Nunca','Menos de una vez al mes','Mensualmente','Semanalmente','A diario o casi a diario']],['¿Usted u otra persona sufrió lesiones a consecuencia de su consumo de alcohol?',['No','Sí, pero no durante el último año','Sí, durante el último año']],['¿Algún familiar, amistad o profesional de salud se preocupó por su consumo o le sugirió beber menos?',['No','Sí, pero no durante el último año','Sí, durante el último año']]
];
const state={stage:0,mode:'aplicar',sub:'hogar',audit:{},checks:{},fields:{},open:[]};
const yesNo=['No','Sí','No se sabe'];
function clean(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function checked(key){return !!state.checks[key]}
function box(txt,key){return `<label class="check"><input type="checkbox" data-check="${key}" ${checked(key)?'checked':''}><span>${txt}</span></label>`}
function field(label,key,opts){let v=state.fields[key]??'';return `<div class="tile"><label for="f_${key}">${label}</label><select id="f_${key}" data-field="${key}"><option value="">Seleccione…</option>${opts.map(o=>`<option ${v===o?'selected':''} value="${clean(o)}">${clean(o)}</option>`).join('')}</select></div>`}
function panel(title,body){return `<h3>${title}</h3>${body}`}
function details(title,body,open=false){return `<details ${open?'open':''}><summary>${title}</summary><div class="inner">${body}</div></details>`}
function group(title,arr,prefix){return details(title,arr.map((x,i)=>box(x,prefix+i)).join(''))}
function alertFound(){return ['em0','em1','em2','em3','em4','em5','pro0','pro1','pro2'].some(k=>checked(k))}
function noteSib(){return `<div class="note"><strong>Articulación con PICF y SIBACOM PLUS.</strong> Los hallazgos y necesidades identificados contribuyen a la valoración integral y al análisis de vulnerabilidad familiar. La selección de modalidad de cuidado se realiza según los criterios de la Secretaría de Salud de Boyacá y el juicio clínico y profesional, sin equivalencias automáticas con el puntaje AUDIT. Registre en SIBACOM PLUS lo que corresponda.</div>`}
function auditView(){let rows=audit.map((q,i)=>{let vals=i<8?[0,1,2,3,4]:[0,2,4];return `<div class="tile" style="margin-bottom:9px"><label>${i+1}. ${q[0]}</label><select data-audit="${i}"><option value="">Seleccione respuesta</option>${q[1].map((o,j)=>`<option value="${vals[j]}" ${state.audit[i]===vals[j]?'selected':''}>${o}</option>`).join('')}</select></div>`}).join('');return `<div class="note"><strong>AUDIT (OMS), versión de diez ítems.</strong> Aplicar individualmente, en condiciones de privacidad y sin juicio moral. Las preguntas 1–3 constituyen AUDIT-C. La equivalencia de bebida estándar debe explicarse según el manual y las bebidas locales. En adolescentes y otras poblaciones, utilice instrumentos y criterios apropiados a su edad y contexto.</div>${details('Aplicar AUDIT / AUDIT-C · Cuestionario y calculadora',`<p class="muted">Marque una respuesta por pregunta. El cálculo es automático y permanece solo en esta página mientras está abierta.</p>${rows}<div id="auditResults"></div>`,true)}`}
function auditResult(){let nums=Array.from({length:10},(_,i)=>state.audit[i]);let n=nums.filter(v=>Number.isFinite(v)).length, n3=nums.slice(0,3).filter(v=>Number.isFinite(v)).length, first=n3===3?nums.slice(0,3).reduce((a,b)=>a+b,0):null;let full=n===10?nums.reduce((a,b)=>a+b,0):null;let band=full===null?'Pendiente de completar':full<8?'Puntuación inferior a 8 (orientación OMS)':full<16?'Riesgo o consumo perjudicial posible':full<20?'Riesgo elevado; requiere valoración ampliada':'Posible dependencia; valoración clínica especializada';return `<div class="scorebox"><div class="grid"><div><span class="domain">AUDIT-C · 3 preguntas</span><div class="score">${first===null?'—':first}<small style="font-size:14px"> / 12</small></div><span class="tiny">${n3}/3 respondidas</span></div><div><span class="domain">AUDIT completo</span><div class="score">${full===null?'—':full}<small style="font-size:14px"> / 40</small></div><span class="tiny">${n}/10 respondidas</span></div></div><p><strong>Interpretación orientativa:</strong> ${band}.</p><p class="tiny">Los puntos de corte generales de la OMS no equivalen a un diagnóstico. Pueden requerir adaptación por sexo, edad y contexto; cualquier alarma o daño identificado prevalece sobre el resultado.</p></div>`}
function apply(stage){if(stage===0){return panel('Reconocer el consumo y el contexto',`<div class="note"><strong>Enfoque familiar y sistémico:</strong> explore qué se consume, cómo se relaciona la persona con el alcohol y en qué entorno ocurre, incluyendo daños para otras personas. Mantenga la participación familiar voluntaria y segura.</div>${state.sub==='antes'? `<div class="grid">${field('¿Existe antecedente de consumo identificado en la caracterización?', 'previous',['Sí','No','No disponible'])}${field('¿Se conocen remisiones o intervenciones previas?', 'prevcare',['Sí','No','No disponible'])}</div><p>Revise la información disponible en SIBACOM y servicios, sin reproducir datos identificables en esta herramienta.</p>`:`<div class="grid">${field('Grupo de edad de la persona que consume','age',['Menor de 18 años','18 a 64 años','65 años o más'])}${field('Consumo reconocido o probable','pattern',['Consumo ocasional','Consumo frecuente','Episodios intensos','Consumo con daños','Se desconoce'])}${field('¿Existen responsabilidades de cuidado?','carer',['Sí','No','No se sabe'])}${field('¿La conversación puede realizarse en privado y con seguridad?','privacy',['Sí','No','Requiere ajuste'])}</div>${group('Sustancia · características del consumo',['Episodios de embriaguez','Consumo con medicamentos u otras sustancias','Consumo en situaciones de conducción o trabajo','Consumo durante responsabilidades de cuidado'],'sus')}${group('Persona · salud y disposición',['Daños físicos o mentales relacionados','Pérdida de control o intentos fallidos de reducir','Consumo para afrontar malestar o problemas','Desea hablar del consumo o buscar ayuda'],'pers')}${group('Contexto familiar y comunitario',['Disponibilidad u ofrecimiento frecuente de alcohol','Celebraciones o rutinas asociadas al consumo','Exposición de niños, gestantes o personas dependientes','Conflictos, afectación económica o dificultades de convivencia','Presión social, comercial o barreras de acceso'],'ctx')}`}`)}
if(stage===1){return panel('Valoración escalonada · AUDIT y familia',`<div class="note"><strong>Valoración escalonada e integral:</strong> primero descarte peligros actuales, identifique de forma breve el patrón de consumo y luego aplique AUDIT cuando corresponda. Profundice con la entrevista clínica y familiar cuando existan daños, sospecha de dependencia, vulnerabilidad o exposición de terceros. El tamizaje no establece diagnóstico ni reemplaza el juicio profesional.</div>
<div class="pathgrid"><div><b>1 · Seguridad primero</b><span>Intoxicación, abstinencia, violencia, autolesión y cuidado de terceros. Si hay peligro, active la ruta sin esperar el puntaje.</span></div><div><b>2 · Exploración breve</b><span>Frecuencia, cantidad, episodios intensos, circunstancias de consumo y preocupaciones de la persona.</span></div><div><b>3 · AUDIT / AUDIT-C</b><span>Aplique el instrumento con privacidad y retroalimente su resultado, sin interpretarlo como diagnóstico.</span></div><div><b>4 · Profundización selectiva</b><span>Indague pérdida de control, tolerancia, abstinencia, salud mental, embarazo, comorbilidades, cuidados, daños familiares y entorno.</span></div><div><b>5 · Decisión y continuidad</b><span>Intervención breve cuando corresponda, valoración de mayor intensidad, protección o urgencias y seguimiento efectivo.</span></div></div>
<div class="warning"><strong>Interpretación clínica:</strong> una puntuación baja no descarta riesgo durante el embarazo, en menores, al conducir o cuidar, ni anula señales de violencia o peligro. No asigne una modalidad PICF automáticamente a partir del AUDIT.</div>${auditView()}${group('Daños y situaciones que amplían la valoración',['Deterioro de salud física o mental','Dependencia posible, tolerancia o abstinencia','Embarazo o lactancia con consumo reportado','Afectación del cuidado, crianza o supervisión','Lesiones, pérdidas de memoria o ausencias por alcohol','Necesidad de valorar consumo de otras sustancias'],'val')}${field('Disposición expresada al cambio','change',['No desea cambiar ahora','Considera cambiar','Desea iniciar acciones','Ya ha iniciado cambios'])}`)}
if(stage===2){return panel('Alarmas y canalización prioritaria',`<div class="danger"><strong>Regla de seguridad:</strong> ante peligro actual, active urgencias o las rutas de protección municipales que correspondan, sin esperar un AUDIT completo ni concertar acuerdos familiares.</div>${group('Atención inmediata · urgencias',['Alteración importante de conciencia, intoxicación grave o posible envenenamiento','Convulsiones al reducir o suspender alcohol, o abstinencia grave','Lesión, caída, accidente o trauma grave','Ideación o conducta suicida, amenazas de muerte o peligro actual','Violencia aguda o amenaza seria contra terceros','Complicación obstétrica aguda'],'em')}${group('Protección y seguridad',['Violencia física, sexual o psicológica o coerción','Abandono, abuso o negligencia de niñas, niños, adolescentes o personas dependientes','Cuidado inseguro, exposición repetida a amenazas o ausencia de alternativa segura'],'pro')}${group('Valoración clínica prioritaria',['Pérdida persistente del control o sospecha de dependencia','Temblor, sudoración, taquicardia, náuseas u otros síntomas de abstinencia sin emergencia manifiesta','Consumo durante el embarazo','Comorbilidad mental, medicamentos de riesgo o policonsumo','Daños repetidos o intervenciones breves sin respuesta'],'prio')}<div id="securitySummary"></div>`)}
if(stage===3){return panel('Intervenir según riesgos y daños identificados',`<p>Seleccione los componentes pertinentes. La intervención breve es una respuesta inicial para consumo de riesgo o perjudicial en personas adultas cuando no existe una situación que exige atención de mayor intensidad.</p><div class="note"><strong>Antes de aconsejar:</strong> solicite permiso para hablar, garantice privacidad, pregunte qué preocupa a la persona y explore primero si existe peligro. Una intervención breve no sustituye la atención cuando hay dependencia, abstinencia o daños complejos.</div>${details('Guía práctica · conversación breve durante la visita',`<div class="teachgrid"><div><b>1. Abrir sin juzgar</b><p><em>«¿Podemos conversar sobre cómo el alcohol está influyendo en su salud y en las actividades del hogar?»</em></p><small>Permiso, privacidad y pregunta abierta.</small></div><div><b>2. Devolver hallazgos</b><p><em>«En la valoración aparecieron episodios de consumo y dificultades para cumplir algunas actividades. ¿Cómo lo ve usted?»</em></p><small>Datos concretos, escucha y relación con daños; no etiquetas.</small></div><div><b>3. Explorar disposición</b><p><em>«¿Qué le preocupa más de esta situación? ¿Hay algo que le gustaría cambiar?»</em></p><small>Identifique ambivalencia, capacidades y razones propias.</small></div><div><b>4. Aconsejar y ofrecer opciones</b><p><em>«Reducir la exposición al alcohol disminuye riesgos; no consumir es la opción de menor riesgo. ¿Qué alternativa considera posible en su caso?»</em></p><small>Consejo claro, autonomía y opciones seguras según riesgo.</small></div><div><b>5. Acordar un primer paso</b><p><em>«¿Qué podría hacer, en qué situación y con qué apoyo? ¿Qué obstáculo anticipa?»</em></p><small>Meta específica, pequeña y voluntaria.</small></div><div><b>6. Cerrar y acompañar</b><p><em>«¿Qué entendimos y qué apoyo necesitaría para continuar? Revisaremos juntos los resultados.»</em></p><small>Verifique comprensión y continuidad mediante PICF / SIBACOM.</small></div></div><p class="tiny">Los ejemplos son guiones orientadores elaborados para la interfaz, no frases textuales de las pautas ni un protocolo psicoterapéutico.</p>`,true)}${details('1 · Intervención breve: secuencia de aplicación',`<ol><li>Compartir retroalimentación concreta sobre consumo y daños.</li><li>Relacionar esos hallazgos con salud, vida cotidiana y seguridad familiar.</li><li>Explorar disposición, preocupaciones y razones propias para cambiar.</li><li>Ofrecer consejo personalizado, respetuoso y sin estigma.</li><li>Elegir una meta segura y viable, según valoración clínica.</li><li>Identificar desencadenantes, barreras, apoyos y alternativas.</li><li>Definir acompañamiento y seguimiento en SIBACOM.</li></ol><div class="warning">La reducción del consumo no es una opción suficiente ante embarazo, dependencia con riesgo de abstinencia, conducción, cuidado inseguro o contraindicaciones clínicas. Evite recomendar suspensión brusca ante posible dependencia.</div>`,true)}${details('2 · Conversación breve · FRAMES / FLAGS',`<div class="grid"><div class="tile"><strong>FRAMES</strong><ul><li><b>F:</b> retroalimentación personalizada.</li><li><b>R:</b> responsabilidad y autonomía de la persona.</li><li><b>A:</b> consejo claro.</li><li><b>M:</b> menú de alternativas.</li><li><b>E:</b> empatía.</li><li><b>S:</b> autoeficacia.</li></ul></div><div class="tile"><strong>FLAGS</strong><ul><li><b>F:</b> retroalimentación.</li><li><b>L:</b> escucha.</li><li><b>A:</b> consejo.</li><li><b>G:</b> metas.</li><li><b>S:</b> estrategias.</li></ul></div></div><p>Evite confrontar, exigir confesiones o movilizar familiares para presionar el cambio.</p>`)}${details('Cuando la conversación se dificulta · respuestas del equipo',`<div class="grid"><div class="tile"><b>La persona no reconoce un problema</b><p>Evite discutir. Explore preocupaciones, ofrezca información vinculada con daños concretos y mantenga abierta la posibilidad de otro contacto.</p></div><div class="tile"><b>Hay ambivalencia</b><p>Pregunte qué ventajas y desventajas percibe en el cambio y qué apoyo le ayudaría a dar un primer paso.</p></div><div class="tile"><b>Está preparada para actuar</b><p>Ayude a elegir una meta segura, situaciones desencadenantes, alternativas, apoyos y cómo revisar resultados.</p></div><div class="tile"><b>Persiste consumo o hay recaída</b><p>Revalore daños, dependencia, salud mental y barreras de acceso; no convierta el resultado en una acusación de falta de voluntad.</p></div></div><div class="warning"><b>Alerta:</b> si existe dependencia posible, consumo prolongado con antecedentes de abstinencia o síntomas de abstinencia, no indique suspender bruscamente sin valoración profesional.</div>`)}${details('3 · Intervenciones específicas para familias y cursos de vida',`<ul><li><b>Madres, padres y personas cuidadoras:</b> integre consumo con supervisión, protección y organización de un cuidador alternativo seguro.</li><li><b>Adolescentes:</b> valoración individual y familiar según edad; normas claras, no suministro, comunicación específica y habilidades para situaciones de presión social.</li><li><b>Embarazo:</b> orientación a la abstinencia y articulación prenatal; valoración de dependencia y comorbilidades.</li><li><b>Dependencia o daño complejo:</b> gestión de atención especializada, no solo intervención educativa.</li></ul>`)}${details('4 · Prácticas coherentes en el entorno hogar',`<ul><li>Identificar espacios, celebraciones, horarios y situaciones que facilitan el consumo.</li><li>Evitar conducir, operar maquinaria o cuidar personas dependientes bajo efectos del alcohol.</li><li>Evitar ofrecer alcohol a menores o gestantes y la normalización de la embriaguez.</li><li>Organizar alternativas de cuidado y apoyos seguros cuando sea necesario.</li><li>Reconocer barreras comunitarias y comerciales que no pueden resolverse solo en el hogar.</li></ul><p><strong>Mensaje:</strong> no existe un nivel de consumo completamente seguro; para la salud, la opción de menor riesgo es no consumir.</p>`)}<div class="note">Para ampliar orientaciones, criterios de aplicabilidad y límites de cada intervención, consulte la pauta completa, especialmente las secciones 9.2 y 9.3.</div>`)}
if(stage===4){return panel('Orientaciones para el Plan de Cuidado Familiar',`<div class="note"><strong>La APP orienta; SIBACOM registra.</strong> Seleccione los ámbitos que requieren orientación y concerte las acciones y compromisos en el sistema institucional, sin duplicar aquí el plan.</div><div class="note"><strong>Mensaje transversal:</strong> la familia no es responsable de causar, controlar o curar el consumo de una persona. Su papel posible es reconocer riesgos, proteger a sus integrantes, acordar prácticas seguras cuando sea voluntario y facilitar el acceso a redes y servicios. El equipo de salud mantiene la responsabilidad de valorar, intervenir y coordinar la atención.</div>${details('Límites del cuidado familiar y prevención de la culpabilización',`<ul><li><b>La familia acompaña, pero no reemplaza al profesional:</b> no debe diagnosticar, tratar síntomas de abstinencia ni supervisar permanentemente la conducta de quien consume.</li><li><b>El cambio no se impone:</b> evite señalar culpables, confrontar a la persona en grupo o utilizar compromisos coercitivos.</li><li><b>Los menores no son responsables:</b> no deben esconder bebidas, controlar al adulto, mediar en episodios de violencia ni garantizar que asista a tratamiento.</li><li><b>La seguridad antecede a la concertación:</b> si hay violencia, control o miedo, valore y proteja de forma separada; no reúna a la familia para acuerdos.</li><li><b>Hay determinantes fuera del hogar:</b> disponibilidad, publicidad, presión social y barreras de servicios requieren respuestas comunitarias e institucionales.</li></ul>`,true)}${details('Agencia y entorno familiar protector',`<ul><li>Reconocer capacidades, vínculos, recursos y límites de la familia.</li><li>Identificar una o pocas prácticas modificables y prioritarias.</li><li>Plantear acciones observables, realistas y revisables.</li><li>No delegar el control del consumo ni la recuperación a familiares o menores.</li><li>Concertar solo cuando exista participación voluntaria y segura.</li></ul>`,true)}${details('Guía de compromisos concretos y seguros',`<table><tr><th>Necesidad</th><th>Ejemplo para orientar la concertación</th></tr><tr><td>Cuidado de terceros</td><td>Identificar cuidador alternativo sobrio y disponible.</td></tr><tr><td>Exposición de menores</td><td>No ofrecer bebidas alcohólicas a menores ni asignarles vigilancia del adulto.</td></tr><tr><td>Riesgos del entorno</td><td>Evitar conducción y actividades peligrosas después de consumir.</td></tr><tr><td>Vinculación a servicios</td><td>Facilitar contacto y superar barreras concretas para la valoración.</td></tr><tr><td>Prácticas cotidianas</td><td>Modificar situaciones desencadenantes o rutinas de ofrecimiento de alcohol, cuando sea seguro.</td></tr></table><p>En SIBACOM: acción, responsables, apoyos, frecuencia, plazo y modo de verificación.</p>`)}${details('Articulación con modalidad de cuidado PICF',`<p>Los riesgos y necesidades identificados por el consumo deben considerarse dentro de la valoración integral de la familia y de cada integrante. Estos hallazgos contribuyen al análisis de vulnerabilidad familiar y a la selección de la modalidad de cuidado, básico o especial con sus respectivas tipologías, conforme a los criterios territoriales de la Secretaría de Salud de Boyacá, mediante análisis sistémico y relacional y juicio clínico y profesional.</p><p><b>No existe equivalencia automática entre el AUDIT, las alarmas y una modalidad de cuidado.</b></p>`)}${noteSib()}`)}
return panel('Continuidad de la atención y registro en SIBACOM',`<p>La APP no solicita volver a diligenciar actividades, acuerdos ni fechas. Utilice esta guía para verificar la continuidad del cuidado y registre los resultados en SIBACOM PLUS.</p>${details('Qué verificar en cada contacto',`<ul><li>Cambios en patrón y circunstancias del consumo.</li><li>Nuevos episodios de riesgo, lesiones, amenazas o violencia.</li><li>Seguridad de niñas, niños y personas dependientes.</li><li>Avance de medidas concretas de cuidado familiar.</li><li>Acceso efectivo a salud mental, atención clínica o protección.</li><li>Barreras y necesidad de modificar o intensificar la intervención.</li></ul>`,true)}${details('Cómo completar el circuito de remisión',`<ol><li>Explicar la razón y el objetivo del contacto con otro servicio.</li><li>Verificar comprensión, aceptación y condiciones de seguridad.</li><li>Identificar y gestionar barreras de acceso.</li><li>Confirmar que la atención efectivamente se produjo.</li><li>Revalorar el caso si la vinculación no se concretó.</li></ol>`)}${details('Criterios para retomar o intensificar la valoración',`<ul><li>Abstinencia, dependencia, deterioro o comorbilidad no evaluados.</li><li>Persistencia o recurrencia de daños.</li><li>Violencia, riesgo actual o inseguridad en el cuidado.</li><li>Ausencia de respuesta a la intervención inicial.</li><li>Cambios en embarazo, tratamientos o responsabilidades de cuidado.</li></ul>`)}${noteSib()}<p class="tiny">La pauta no define una frecuencia universal óptima de seguimiento familiar; programe los contactos de acuerdo con el ciclo PICF, la condición clínica, la seguridad y las rutas disponibles.</p>`)}
function reference(){return `<h3>Documento de referencia</h3><div class="ref"><div class="glyph">▤</div><div><strong>Pautas de cuidado basadas en la evidencia para el abordaje del consumo de alcohol en la familia en el entorno hogar</strong><p class="muted">Secretaría de Salud de Boyacá · Documento técnico completo, 74 páginas.</p><a class="refbtn" href="Pautas_consumo_alcohol_PICF.pdf" target="_blank" rel="noopener">Consultar pautas completas (PDF) ↗</a><p class="tiny">El acceso al PDF podrá configurarse en la integración institucional. Este módulo HTML funciona de manera autónoma.</p></div></div><hr style="border:0;border-top:1px solid #e0ece5;margin:21px 0"><strong>Correspondencia con la pauta</strong><p>Etapa ${state.stage+1}: ${refs[state.stage]}.</p><p><b>Secciones centrales:</b> 9.1 generales (pp. 48–51), 9.2 valoración inicial (pp. 51–54), 9.3 intervenciones (pp. 54–58), 9.4 canalización prioritaria (pp. 58–60) y 9.5 agencia y entorno protector (pp. 60–63).</p><p class="tiny">Para la calculadora AUDIT: OMS, AUDIT, 2.ª edición (2001). La interpretación debe contrastarse con el manual y la situación clínica.</p>`}
function comprehension(){return `<h3>Comprender · Claves de razonamiento clínico y familiar</h3><p class="muted">Estas claves ayudan a interpretar hallazgos sin sustituir la valoración ni duplicar formularios.</p>${understand[state.stage].map((x,i)=>`<div class="tile" style="margin:9px 0"><span class="domain">CLAVE ${i+1}</span><p style="margin:4px 0">${x}</p></div>`).join('')}`}
function render(){document.getElementById('steps').innerHTML=stages.map((s,i)=>`<button type="button" class="step ${i===state.stage?'active':''}" data-step="${i}"><span>${i+1}</span>${s}</button>`).join('');document.querySelectorAll('[data-mode]').forEach(el=>{el.classList.toggle('active',el.dataset.mode===state.mode)});document.getElementById('kicker').textContent=`ETAPA ${state.stage+1} DE 6`;document.getElementById('stageTitle').textContent=stages[state.stage];document.getElementById('stageRef').textContent=refs[state.stage];const showSub=state.mode==='aplicar'&&state.stage===0;document.getElementById('subtabs').style.display=showSub?'flex':'none';document.querySelectorAll('[data-sub]').forEach(el=>el.classList.toggle('active',el.dataset.sub===state.sub));document.getElementById('content').innerHTML=state.mode==='aplicar'?apply(state.stage):state.mode==='comprender'?comprehension():reference();document.getElementById('prev').disabled=state.stage===0;document.getElementById('next').textContent=state.stage===5?'Volver al inicio ↻':'Siguiente →';refreshCalculations()}
function refreshCalculations(){let a=document.getElementById('auditResults');if(a)a.innerHTML=auditResult();let sec=document.getElementById('securitySummary');if(sec)sec.innerHTML=alertFound()?'<div class="danger"><strong>Situación de seguridad identificada.</strong> Priorice la evaluación inmediata, la atención o la ruta de protección correspondiente. La clasificación no se deriva del AUDIT.</div>':'<div class="note">Si no identificó alarmas en esta exploración, continúe con la valoración del consumo y la respuesta pertinente. La ausencia de casillas marcadas no garantiza ausencia de riesgo.</div>'}
document.addEventListener('click',e=>{let st=e.target.closest('[data-step]');if(st){state.stage=+st.dataset.step;state.mode='aplicar';render();scrollTo({top:0,behavior:'instant'});return}let m=e.target.closest('[data-mode]');if(m){state.mode=m.dataset.mode;render();return}let s=e.target.closest('[data-sub]');if(s){state.sub=s.dataset.sub;render();return}});
document.addEventListener('change',e=>{let t=e.target;if(t.dataset.audit!==undefined){state.audit[+t.dataset.audit]=t.value===''?undefined:+t.value;refreshCalculations()}if(t.dataset.check){state.checks[t.dataset.check]=t.checked;refreshCalculations()}if(t.dataset.field){state.fields[t.dataset.field]=t.value}});
document.getElementById('prev').onclick=()=>{if(state.stage>0){state.stage--;state.mode='aplicar';render()}};document.getElementById('next').onclick=()=>{state.stage=(state.stage+1)%6;state.mode='aplicar';render()};render();
</script></body></html>
