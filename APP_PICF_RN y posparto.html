<!DOCTYPE html>

<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><meta content="#123f36" name="theme-color"/><title>APP PICF · Recién nacido y mujer en posparto · v1.0</title><style>
:root{--deep:#123f36;--green:#14715d;--mint:#edf5ef;--bg:#f7faf8;--line:#d9e7df;--ink:#193e34;--muted:#647b6d;--red:#992f30;--amber:#925f13}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.6 Inter,system-ui,Segoe UI,Arial,sans-serif;color:var(--ink)}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #cba84d;outline-offset:2px}header{background:var(--deep);color:white;padding:17px max(20px,calc((100vw - 1380px)/2));display:flex;gap:22px;align-items:center}header img{width:245px;max-width:38vw;background:#fff;padding:9px;border-radius:10px}header strong{font-size:22px;display:block;line-height:1.3}header small{display:block;color:#d8ece3}header .sp{flex:1}.shell{max-width:1440px;margin:auto;padding:34px 24px 65px}.module-head{background:#eff6f0;border:1px solid var(--line);border-radius:21px;padding:23px 28px;margin-bottom:19px}.kicker{color:#338268;letter-spacing:.095em;font-weight:850;font-size:12px}.module-head h1{margin:3px 0;font-size:28px}.module-head p{margin:0;color:var(--muted)}.app{background:#f4f8f5;border:1px solid var(--line);border-radius:21px;overflow:hidden}.banner{display:flex;gap:20px;align-items:center;background:var(--deep);padding:19px 28px;color:white}.banner img{width:255px;max-width:32%;border-radius:9px;background:white;padding:9px}.banner strong{font-size:20px}.banner small{display:block;color:#dcebe3}.ver{margin-left:auto;border:1px solid #729586;padding:10px 16px;border-radius:30px;white-space:nowrap}.steps{display:flex;overflow-x:auto;gap:8px;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px}.step{border:0;background:transparent;color:#497263;border-radius:9px;padding:10px 12px;white-space:nowrap;display:flex;align-items:center;gap:9px;font-weight:650}.step span{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:9px;background:#edf4ef}.step.active{background:#e4f2e9;color:#075d47}.step.active span{background:#126a53;color:#fff}.stagehead{padding:23px 28px 2px}.stagehead h2{font-size:28px;margin:3px 0}.stagehead p{color:var(--muted);margin:0}.tabs{display:flex;margin:18px 26px 0;border-radius:13px;padding:6px;background:#edf4ef;border:1px solid var(--line);gap:5px}.tab{flex:1;border:0;border-radius:9px;background:transparent;color:#275f4c;font-weight:800;padding:13px 9px}.tab.active{background:var(--green);color:white}.subtabs{display:flex;gap:9px;margin:15px 27px 0}.subtab{border:1px solid #b8d3c4;border-radius:30px;background:white;padding:9px 17px;color:#23634d;font-weight:700}.subtab.active{background:#dceee5}.panel{background:white;border-radius:16px;border:1px solid var(--line);margin:18px 27px;padding:25px;min-height:280px}.panel h3{font-size:21px;margin:0 0 12px}.panel h4{font-size:17px;margin:20px 0 8px}.panel p{line-height:1.7}.muted{color:var(--muted)}.note{background:#eef7f0;border-left:4px solid #257b60;border-radius:8px;padding:14px 17px;margin:15px 0}.warning{background:#fff7eb;border-left:4px solid #ba842f;padding:14px 17px;margin:14px 0;border-radius:8px}.danger{background:#fff0ed;border-left:4px solid var(--red);padding:14px 17px;margin:14px 0;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.tile{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.tile p{margin:5px 0}.tile strong{color:#194b39}.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tri>div{padding:16px;border-radius:11px;background:#f0f6f1;border:1px solid #d4e7dc}details{border:1px solid #dae8df;border-radius:12px;overflow:hidden;background:white;margin:12px 0}summary{padding:16px 18px;font-weight:800;cursor:pointer;background:#f5f9f6}details[open]>summary{background:#e6f2ea}details .inside{padding:17px}ul,ol{padding-left:23px;line-height:1.75}li{margin:5px 0}label{display:block;margin:10px 0 6px;font-weight:680}select,input[type=number]{background:white;border:1px solid #a9c5b5;border-radius:8px;padding:9px 11px;max-width:100%;width:100%}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.opt{border:1px solid #d9e4dd;border-radius:9px;padding:10px;display:flex;gap:8px;align-items:flex-start;font-weight:450;margin:0}.opt input{accent-color:#156c53;margin-top:5px}.result{font-size:28px;font-weight:900;color:#176f53}.tiny{font-size:12px;color:var(--muted)}.route{padding:13px;border:1px solid var(--line);border-radius:11px;margin:10px 0}.route.critical{border-color:#d89b95;background:#fff0ec}.route.high{border-color:#e9c587;background:#fff7e9}.actions{display:flex;justify-content:space-between;gap:12px;padding:0 27px 24px}.btn{border:1px solid var(--green);background:var(--green);color:white;padding:12px 19px;font-weight:800;border-radius:10px}.btn.alt{background:white;color:var(--green)}.btn:disabled{opacity:.4}.keys{list-style:none;padding:0}.keys li{border-bottom:1px solid #e7eee8;padding:12px 8px 12px 30px;position:relative}.keys li:before{content:'✓';position:absolute;left:4px;color:#18795f;font-weight:900}.refbtn{display:inline-block;text-decoration:none;padding:12px 18px;background:#176c59;color:white;border-radius:9px;font-weight:800}.footer{margin:20px 0 0;text-align:center;color:var(--muted);font-size:12px}.chip{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;background:#e3f0e9;padding:5px 10px;color:#1d694e}.flow{counter-reset:n}.flow div{padding:11px 12px;border-bottom:1px solid var(--line)}.flow div:before{counter-increment:n;content:counter(n);display:inline-grid;place-items:center;width:28px;height:28px;color:white;background:#15745b;border-radius:9px;margin-right:10px;font-weight:800}@media(max-width:850px){.shell{padding:13px}.banner{flex-wrap:wrap;padding:14px}.banner img{width:205px;max-width:65%}.ver{margin:0}.panel{margin:12px;padding:17px}.tabs{margin:12px 12px 0}.stagehead{padding:17px 17px 0}.steps{padding:9px}.actions{padding:0 12px 16px}.tri,.grid{grid-template-columns:1fr}header{padding:12px}.opts{grid-template-columns:1fr}.subtabs{margin:12px}}

<div class="shell"><div class="app"><nav aria-label="Etapas de la visita" class="steps" id="steps"></nav><div class="stagehead"><div class="kicker" id="stageNum"></div><h2 id="stageTitle"></h2><p id="stageDesc"></p></div><div class="tabs" role="tablist"><button class="tab active" data-tab="aplicar">Aplicar</button><button class="tab" data-tab="comprender">Comprender</button><button class="tab" data-tab="evidencia">Consultar evidencia</button></div><div class="subtabs" hidden="" id="subtabs"><button class="subtab active" data-sub="antes">Antes de la visita</button><button class="subtab" data-sub="hogar">En el hogar</button></div><section aria-live="polite" class="panel" id="content"></section><div class="actions"><button class="btn alt" id="prev">← Anterior</button><button class="btn" id="next">Siguiente →</button></div></div><div class="footer">Secretaría de Salud de Boyacá · PICF · Herramienta de apoyo al juicio profesional. Registre el cuidado en SIBACOM PLUS.</div></div>
<script>
const stages=[['Reconocer','Reconocer la familia y preparar la visita','Preclasificación, continuidad y riesgos conocidos'],['Valorar','Valoración integral y escalonada','Mujer, recién nacido, salud mental, familia y entorno'],['Riesgos y alarmas','Clasificar la prioridad y activar rutas','El hallazgo de mayor gravedad gobierna la decisión'],['Intervenir','Intervenir según los hallazgos','Lactancia, cuidado esencial, recuperación, salud mental y apoyo familiar'],['Orientar el plan','Agencia de cuidado y corresponsabilidad','Aprendizaje práctico, redes y compromisos viables'],['Seguimiento','Continuidad y registro institucional','Verificación de acceso y actualización de los riesgos']];
let stage=0,mode='aplicar',sub='hogar';let checked=new Set(),risk='';
// Anexo 5 de la Resolución 3280 de 2018: Escala Obstétrica de Alerta Temprana.
// Puntaje de la norma. En el entorno hogar, cualquier signo vital alterado requiere valoración institucional.
const obsValues={pas:'',pad:'',fr:'',fc:'',ox:'',temperatura:'',conciencia:''};
const OBS_SOURCE='Resolución 3280 de 2018, anexo 5, Escala Obstétrica de Alerta Temprana';
function obsForm(){
 const val=k=>obsValues[k]??'';
 const f=(k,label,min,max,step,unit)=>`<label>${label}${unit?' ('+unit+')':''}<input data-obs="${k}" type="number" min="${min}" max="${max}" step="${step}" value="${val(k)}" placeholder="Ingrese el dato medido" inputmode="decimal"></label>`;
 const opt=(k,label,choices)=>`<label>${label}<select data-obs="${k}"><option value="">Seleccione…</option>${choices.map(([v,t])=>`<option value="${v}" ${val(k)===v?'selected':''}>${t}</option>`).join('')}</select></label>`;
 return `<p>Use esta escala únicamente si dispone de los equipos y de las competencias necesarias. Registre todas las variables para obtener un puntaje completo. <strong>No retrase una remisión por completar la escala.</strong></p>
 <div class="grid obstetric-fields">${f('pas','Presión arterial sistólica',40,260,1,'mmHg')}${f('pad','Presión arterial diastólica',20,180,1,'mmHg')}${f('fr','Frecuencia respiratoria',1,70,1,'resp/min')}${f('fc','Frecuencia cardiaca',20,240,1,'lat/min')}${f('temperatura','Temperatura',30,43,.1,'°C')}
 ${opt('ox','Oxígeno requerido para mantener saturación > 95 %',[['aire','Aire ambiente (sin oxígeno suplementario)'],['24-39','Oxígeno 24–39 %'],['40+','Oxígeno ≥ 40 %'],['otro','Dato no clasificable o no disponible']])}
 ${opt('conciencia','Estado de conciencia',[['alerta','Alerta'],['noalerta','No alerta']])}</div>
 <div class="note tiny">La variable normativa es el <strong>oxígeno requerido para mantener saturación &gt; 95 %</strong>, no la lectura aislada del pulsioxímetro. Si no puede determinarla, no calcule un puntaje completo.</div>
 <div id="obsResult" class="note" aria-live="polite">Complete los siete parámetros para interpretar el puntaje.</div>
 <div class="danger"><strong>Aplicación en el entorno hogar:</strong> cualquier signo vital materno alterado requiere valoración institucional, independientemente del puntaje. Ante hemorragia, cefalea intensa, convulsiones, disnea, dolor torácico, alteración de conciencia u otros signos de alarma, active la ruta de urgencia de inmediato, sin esperar la escala.</div>
 <p class="tiny">Fuente: ${OBS_SOURCE}. Los intervalos de observación del anexo corresponden a atención institucional y no son instrucciones para mantener a la mujer en el hogar.</p>`;
}
function obsScore(k,v){
 const n=Number(v);
 if(k==='pas')return n<80?3:n<90?2:n<=139?0:n<=149?1:n<=159?2:3;
 if(k==='pad')return n<90?0:n<=99?1:n<=109?2:3;
 if(k==='fr')return n<10?3:n<=17?0:n<=24?1:n<=29?2:3;
 if(k==='fc')return n<60?3:n<=110?0:n<=149?2:3;
 if(k==='temperatura')return n<34?3:n<=35?1:n<38?0:n<39?1:3;
 if(k==='ox')return v==='aire'?0:v==='24-39'?1:v==='40+'?3:null;
 if(k==='conciencia')return v==='alerta'?0:v==='noalerta'?3:null;
 return null;
}
function updateObs(){
 const target=document.getElementById('obsResult'); if(!target)return;
 const keys=['pas','pad','fr','fc','temperatura','ox','conciencia'];
 const completed=keys.filter(k=>obsValues[k]!==''&&obsValues[k]!==null).length;
 if(completed!==7||obsValues.ox==='otro'){
   target.className='note'; target.textContent=`${completed}/7 parámetros registrados. No se emite puntuación con datos incompletos o no clasificables. Ante una alteración o signo de alarma, active la valoración institucional sin esperar el resultado.`;return;
 }
 const ranges={pas:[40,260],pad:[20,180],fr:[1,70],fc:[20,240],temperatura:[30,43]};
 for(const [k,[lo,hi]] of Object.entries(ranges)){
   const x=Number(obsValues[k]); if(!Number.isFinite(x)||x<lo||x>hi){target.className='warning';target.textContent='Revise los datos ingresados: hay un valor fuera del rango permitido. No se calcula el puntaje.';return;}
 }
 const scores=keys.map(k=>obsScore(k,obsValues[k]));
 if(scores.some(x=>x===null||!Number.isFinite(x))){target.className='warning';target.textContent='No se pudo clasificar un dato. Revise los valores y la necesidad de oxígeno.';return;}
 const total=scores.reduce((a,b)=>a+b,0),single3=scores.includes(3);
 const grade=total>=6?'Respuesta de emergencia (institucional)':single3||total>=4?'Respuesta urgente (institucional)':total>=1?'Observación y llamado a enfermería (institucional)':'Observación de rutina (institucional)';
 target.className=total>0?'warning':'note';
 target.innerHTML=`<strong>Escala Obstétrica de Alerta Temprana: ${total} puntos.</strong><p style="margin:6px 0"><strong>Respuesta según el anexo 5:</strong> ${grade}.</p><p style="margin:6px 0"><strong>En el entorno hogar:</strong> ${total>0?'se detectó al menos un parámetro fuera del rango de 0 puntos; gestione valoración institucional y active urgencias si corresponde.':'la puntuación cero no descarta una complicación; evalúe síntomas y antecedentes.'}</p><p class="tiny">Valores por parámetro (PAS, PAD, FR, FC, temperatura, oxígeno, conciencia): ${scores.join(' · ')}. Un parámetro con 3 puntos impone respuesta urgente aun si la suma es menor de 4; una suma ≥ 6 activa respuesta de emergencia.</p>`;
}
const D=(t,b,open=false)=>`<details ${open?'open':''}><summary>${t}</summary><div class="inside">${b}</div></details>`;
const L=(a)=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const C=(id,items)=>`<div class="opts">${items.map((x,i)=>`<label class="opt"><input type="checkbox" data-ck="${id}-${i}" ${checked.has(id+'-'+i)?'checked':''}> <span>${x}</span></label>`).join('')}</div>`;
const note=(x)=>`<div class="note">${x}</div>`;
// PHQ-9: nueve reactivos (0-3), periodo de referencia de dos semanas.
// Versión española de los nueve dominios. Puntos de corte convencionales,
// sujetos a evaluación de pertinencia en mujeres puérperas del territorio.
const phq9Questions=[
 'Poco interés o placer en hacer las cosas.',
 'Sentirse decaída, deprimida o sin esperanza.',
 'Dificultad para quedarse dormida, continuar durmiendo o dormir demasiado.',
 'Sentirse cansada o con poca energía.',
 'Poco apetito o comer en exceso.',
 'Sentirse mal consigo misma, sentir que ha fracasado o que ha defraudado a su familia.',
 'Dificultad para concentrarse, por ejemplo, al leer o ver televisión.',
 'Moverse o hablar tan despacio que otras personas lo noten, o estar tan inquieta que se mueve mucho más de lo habitual.',
 'Pensar que estaría mejor muerta o en hacerse daño de alguna manera.'
];
const phq9Options=[['0','Ningún día (0)'],['1','Varios días (1)'],['2','Más de la mitad de los días (2)'],['3','Casi todos los días (3)']];
const phq9Values=Array(9).fill('');
let phq9Impact='';
function phq9Result(){
 const box=document.getElementById('phq9Result');if(!box)return;
 const count=phq9Values.filter(v=>v!==''&&v!==undefined).length;
 const item9=phq9Values[8]!==''?Number(phq9Values[8]):null;
 const urgent=item9!==null&&item9>0;
 const alert=document.getElementById('phq9Safety');
 if(alert){alert.hidden=!urgent; if(urgent)alert.innerHTML='<strong>Alerta de seguridad por respuesta al ítem 9.</strong> Cualquier respuesta distinta de «Ningún día» requiere evaluación clínica pronta y directa de riesgo suicida, incluidos intención, plan, medios disponibles y factores protectores; determinar urgencia y activar la ruta correspondiente. Si hay peligro inmediato, activar urgencias y no dejar sola a la mujer. Esta alerta se activa independientemente del puntaje total o de que falten otras respuestas.';}
 if(count<9){box.className='note';box.innerHTML='<strong>PHQ-9: '+count+'/9 respuestas completas.</strong><p>Complete las nueve respuestas para calcular el total. No se asigna puntaje provisional.</p>';return;}
 const total=phq9Values.reduce((a,b)=>a+Number(b),0);
 const label=total<=4?'mínimos':total<=9?'leves':total<=14?'moderados':total<=19?'moderadamente graves':'graves';
 const positive=total>=10;
 box.className=urgent?'danger':positive?'warning':'note';
 box.innerHTML='<strong>PHQ-9: '+total+'/27 puntos. Síntomas '+label+'.</strong>'+
 '<p>'+ (positive?'Puntuación igual o superior al umbral orientativo de 10: coordinar evaluación clínica diagnóstica y seguimiento.':'El resultado no descarta depresión ni reemplaza la valoración clínica o familiar.')+'</p>'+
 '<p class="tiny">Bandas convencionales: 0–4 mínimos; 5–9 leves; 10–14 moderados; 15–19 moderadamente graves; 20–27 graves. Los puntos de corte no se han validado específicamente para mujeres puérperas de Boyacá. En el posparto, sueño, apetito y fatiga también requieren interpretación contextual.</p>'+
 (urgent?'<p><strong>La alerta del ítem 9 prevalece sobre la puntuación total.</strong></p>':'');
}
function bienestarMaterno(){return `<p class="muted">En un espacio privado, respetuoso y sin acompañantes cuando sea necesario, aplique el Cuestionario de Salud del Paciente, PHQ-9, como apoyo a la tamización de síntomas depresivos en las últimas dos semanas. Sus resultados no constituyen diagnóstico y se interpretan junto con la situación clínica y familiar.</p>
<div class="note"><strong>PHQ-9 · Valoración de síntomas depresivos.</strong> Durante las últimas dos semanas, ¿con qué frecuencia le han molestado las siguientes situaciones?</div>
${phq9Questions.map((q,i)=>`<div class="phq9-q"><label for="phq9-${i}"><b>${i+1}. ${q}</b></label><select id="phq9-${i}" data-phq9="${i}" aria-label="PHQ-9, pregunta ${i+1}"><option value="">Seleccione una respuesta</option>${phq9Options.map(([v,t])=>`<option value="${v}" ${phq9Values[i]===v?'selected':''}>${t}</option>`).join('')}</select></div>`).join('')}
<div id="phq9Safety" class="danger" role="alert" hidden></div>
<div id="phq9Result" class="note" aria-live="polite"></div>
<div class="tile"><label for="phq9-impact"><strong>Interferencia con la vida cotidiana (pregunta complementaria, no suma puntos)</strong></label><p class="tiny">Si marcó algún síntoma, ¿qué tan difícil le ha resultado trabajar, atender su hogar o relacionarse con otras personas debido a estos problemas?</p><select id="phq9-impact" data-phq9-impact="1"><option value="">No registrada</option>${['Nada difícil','Algo difícil','Muy difícil','Extremadamente difícil'].map(t=>`<option value="${t}" ${phq9Impact===t?'selected':''}>${t}</option>`).join('')}</select></div>
<div class="note"><strong>Interpretación y ruta:</strong> ante resultado positivo, síntomas persistentes, deterioro funcional o preocupación clínica, coordine evaluación diagnóstica y seguimiento. Una respuesta positiva al ítem 9 exige exploración directa de seguridad cualquiera que sea el total. Consulte la ruta institucional para urgencias, salud mental y protección cuando corresponda.</div>
<div class="note"><strong>Enfoque familiar:</strong> explore descanso, relaciones, autonomía, apoyo al cuidado, violencia y barreras de acceso. No atribuya automáticamente al trastorno depresivo los cambios de sueño, fatiga o apetito asociados al puerperio. Registre las acciones y continuidad en SIBACOM PLUS.</div>
<p class="tiny">Fuente: PHQ-9 (Spitzer, Kroenke y Williams; Pfizer). Nueve reactivos con puntuación 0–3. Uso de la versión en español para valoración orientativa, sujeto a revisión de pertinencia de puntos de corte en la población del PICF.</p>`}

function aplicar(){if(stage===0){if(sub==='antes')return `<h3>Antes de la visita · preclasificación y continuidad</h3>${note('Recupere la información de SIBACOM PLUS y de la Ruta Materno-Perinatal. Si ya existe, no vuelva a diligenciarla en esta herramienta.')}${D('Antecedentes maternos y neonatales',C('prev',['Gestación y parto con complicaciones, preeclampsia, hipertensión, hemorragia o infección','Morbilidad materna extrema o ingreso a UCI','RN prematuro, bajo peso, reanimación u hospitalización','Parto extrahospitalario o no institucional','Antecedentes de salud mental, violencia o falta de apoyo','Antecedentes de infección / ETMI-Plus: VIH, sífilis, hepatitis B, Chagas']),true)}${D('Verificación de continuidad',C('cont',['Epicrisis e historia clínica disponibles','Resultados y pendientes de tamizajes neonatales','Vacunación y carné infantil','Control posparto y neonatal programados','Afiliación y acceso a servicios','Remisiones y seguimiento de tratamientos pendientes']))}${note('Parto no institucional: priorice la visita y canalice de inmediato a la institución más cercana para evaluación materno-neonatal, tamizajes y vacunas. Morbilidad materna extrema: riesgo alto y seguimiento prioritario.')}`;return `<h3>Reconocer en el hogar</h3><p>Explore el contexto de la díada y quiénes participan en el cuidado, con respeto por la autonomía de la mujer y la diversidad de las familias.</p>${D('Familia, apoyo y descanso',C('family',['Quién acompaña a la mujer y al bebé','Relevo real para descanso y alimentación de la mujer','Persona disponible para urgencias y traslado','Recursos de apoyo: familia extensa, vecindario, comunidad','Necesidades y preocupaciones expresadas por la mujer']),true)}${D('Condiciones de acceso',C('access',['Distancia y transporte a servicios','Señal telefónica o alternativas de comunicación','Barreras económicas, administrativas, culturales o lingüísticas','Ubicación y contacto del servicio de urgencias','Remisiones pendientes verificadas']))}`}
if(stage===1){if(sub==='antes')return `<h3>Valoración escalonada · preparación</h3>${note('<strong>No se trata de aplicar todas las escalas.</strong> Primero identifique signos de peligro y necesidades prioritarias; luego valore conjuntamente a la mujer y al recién nacido, profundizando selectivamente por dominios. Los instrumentos no sustituyen el juicio clínico ni la observación del hogar.')}<div class="flow"><div>Recupere antecedentes clínicos, egreso, controles y tamizajes.</div><div>Identifique alarmas maternas, neonatales, mentales y de protección.</div><div>Observe a la mujer y al recién nacido y sus interacciones.</div><div>Profundice en el bienestar emocional, observe la lactancia y valore el contexto familiar según necesidad.</div><div>Integre entorno, redes y accesibilidad; determine la mayor gravedad.</div></div>${D('Recursos a preparar',L(['Tensiómetro validado, termómetro, fonendoscopio y pulsioxímetro, de acuerdo con competencias.','Carnés, historia o resumen de egreso y fichas de tamizaje.','Material para consejería y mecanismos funcionales de remisión.']))}`;return `<h3>Valoración integral por dominios</h3>${note('La valoración es modular, escalonada e interdependiente: una complicación materna puede afectar el cuidado del RN, y una dificultad neonatal puede comprometer el bienestar emocional o la recuperación de la mujer.')}<span class="chip">Abra únicamente los dominios pertinentes</span>
${D('01 · Mujer en posparto · revisión clínica y recuperación',C('maternal',['Sangrado, loquios, dolor uterino, abdominal o pélvico','Heridas perineales o de cesárea y signos de infección','Cefalea, visión borrosa, edema súbito, síntomas hipertensivos','Disnea, dolor torácico o edema doloroso unilateral','Micción, intestino, descanso, hidratación y alimentación','Pecho, dolor mamario, fiebre, dificultades de lactancia'])+`<div class="grid"><div><label>Presión sistólica (mmHg)</label><input type="number" id="sbp" min="40" max="260" placeholder="Si está disponible"></div><div><label>Presión diastólica (mmHg)</label><input type="number" id="dbp" min="20" max="180" placeholder="Si está disponible"></div></div><div id="bpResult" class="note tiny">Ingrese ambos valores para una orientación de alerta. La presencia de síntomas prevalece.</div>`,true)}
${D('Escala Obstétrica de Alerta Temprana · Anexo 5 RIA Materno Perinatal',obsForm())}
${D('02 · Recién nacido · evaluación clínica',C('baby',['Aspecto, color, respuesta, llanto, tono y movimientos','Respiración, tiraje, quejido, frecuencia respiratoria','Temperatura, piel, cordón y posibles signos de infección','Ictericia (inicio, evolución, escleróticas, palmas y plantas)','Peso, eliminación urinaria y deposiciones','Vacunas, controles, tamizajes y remisiones pendientes'])+`<div class="grid"><div><label>Respiraciones por minuto (opcional)</label><input id="rr" type="number" min="0" max="150" placeholder="Respiraciones/min"></div><div><label>Temperatura neonatal (°C, opcional)</label><input id="temp" type="number" min="25" max="45" step="0.1" placeholder="°C"></div></div><div id="babyResult" class="note tiny">Signos de peligro requieren remisión sin esperar otras mediciones.</div>`)}
${D('03 · Alimentación, lactancia y vínculo',C('feeding',['Observar toma completa si es posible: posición y agarre','Succión y deglución efectivas; señales de hambre y saciedad','Dolor, lesiones, dificultades o presión familiar','Número de tomas, micción, deposiciones y evolución del peso','Alimentación alternativa segura si corresponde','Contacto sensible, lectura y respuesta a señales del bebé'])+note('Una técnica de agarre deficiente con RN estable exige apoyo y nueva observación. Rechazo del alimento, letargia, deshidratación o deterioro obligan a valoración clínica.'))}
${D('04 · Salud mental materna · PHQ-9 y seguridad',bienestarMaterno())}
${D('05 · Protección, vínculos y red familiar',C('psy',['Privacidad para explorar violencia, amenazas o control coercitivo','Bienestar emocional y agotamiento de otros cuidadores','Apoyo para recuperación de la mujer, descanso y alimentación','Cuidador seguro capaz de responder ante signos de alarma','Instrumentos PICF pertinentes: APGAR familiar, ecomapa, familiograma','Zarit solo ante cuidado intensivo o sospecha de sobrecarga, no universal']))}
${D('06 · Entorno hogar y capacidad de acceso',C('home',['Sueño del RN boca arriba, superficie firme y sin objetos sueltos','Exposición a humo, sedantes, alcohol o sustancias','Temperatura, ventilación e higiene del hogar','Agua segura, cuidado limpio y seco del cordón','Almacenamiento seguro de medicamentos y sustancias','Disponibilidad real de transporte y atención de urgencia'])+note('El hogar y la red de cuidado son componentes del riesgo, no simples antecedentes administrativos.'))}
${D('07 · Verificación de exámenes institucionales',L(['Verificar en el resumen de egreso o carné si se realizó la valoración neonatal de ojos, corazón, caderas y testículos (cuando corresponda), revisar sus resultados y confirmar que se atiendan las remisiones pendientes. El equipo domiciliario no debe repetir el examen especializado sin la formación y competencias requeridas.','Tamizajes metabólicos, auditivos y de cardiopatías, vacunación y resultados pendientes.','La bilirrubinometría y la valoración diagnóstica de complicaciones se coordinan con los servicios institucionales.']))}`}
if(stage===2)return `<h3>Seguridad y clasificación según el hallazgo más grave</h3>${note('No acumule puntos ni espere a completar instrumentos de tamización. <strong>Un solo signo de peligro basta para activar una respuesta.</strong> Distinga señales de la mujer, del RN y de la protección familiar.')}${D('Alarmas del recién nacido · activar atención inmediata',C('redrn',['No responde, convulsiones, cianosis, apnea, dificultad respiratoria marcada o RR >60/min','Rechaza alimento, succión muy débil, letargia, deshidratación o vómito bilioso','Temperatura >37,5 °C o <35,5 °C, especialmente con mal estado general','Ictericia antes de 24 horas, palmas/plantas amarillas o con deterioro','Rash que no blanquea, fontanela abombada o aspecto gravemente enfermo']),true)}${D('Alarmas de la mujer · activar urgencias',C('redmom',['Sangrado muy abundante o creciente, coágulos grandes, mareo o desmayo','Convulsiones, cefalea intensa y alteraciones visuales, PA ≥160/110','Dolor torácico, disnea, colapso o dolor/edema unilateral de pierna','Fiebre con deterioro, dolor uterino y loquios malolientes: posible sepsis','Ideación suicida, psicosis, riesgo hacia el bebé, confusión o incapacidad grave para cuidar']))}${D('Protección y riesgos del entorno',C('redenv',['Violencia o amenaza inmediata para la mujer o el bebé','No existe una persona adulta segura para cuidar','Desprotección grave, privación de necesidades esenciales','Exposición ambiental inminente: incendio, intoxicación, temperaturas extremas','Barreras de acceso que impiden atención urgente']))}<h4>Clasificación orientadora del riesgo</h4><div class="tri"><div><strong>Crítico / inmediato</strong><p>Urgencia clínica, protección o peligro vital. Activación inmediata y contacto con receptor.</p></div><div><strong>Alto / prioritario</strong><p>Prematuridad, bajo peso, trastornos persistentes, tamizaje mental positivo, apoyo insuficiente o barreras graves.</p></div><div><strong>Habitual / programado</strong><p>Díada estable, cuidado suficiente, controles activos y hogar seguro. Mantener seguimiento.</p></div></div><label>Valoración profesional del nivel de riesgo (orientación, no registro clínico)</label><select id="risk"><option value="">Seleccione…</option><option value="habitual">Habitual</option><option value="alto">Alto</option><option value="critico">Crítico</option></select><div id="riskResult" class="note">El nivel debe reflejar el hallazgo más grave, no la suma de casillas.</div>${D('Ruta de respuesta y cierre de la remisión',L(['Urgencia inmediata: interrumpir valoración ordinaria, activar urgencias/protección y organizar traslado seguro.','Atención clínica el mismo día: ante alteraciones significativas sin compromiso inmediato.','Seguimiento prioritario: intensificar contactos y coordinación multidisciplinaria.','Gestión intersectorial: acceso, transporte, protección, seguridad alimentaria y vivienda.','Siempre verificar recepción, llegada, resultado y continuidad de la remisión.']))}`;
if(stage===3)return `<h3>Intervenir según los hallazgos</h3><p>Seleccione las intervenciones pertinentes. En todas las familias debe haber orientación esencial; cuando exista alto riesgo se requiere respuesta reforzada e interdisciplinaria.</p>${D('01 · Consejería estructurada en lactancia y alimentación',L(['Observar una toma completa y conversar sobre expectativas, dificultades y preferencias.','Demostrar postura, agarre y señales de succión/deglución eficaz; acompañar una segunda práctica.','Abordar dolor, lesiones, alimentación suficiente y apoyos para el descanso.','En RN prematuro o con bajo peso, articular seguimiento y programas especializados, incluida modalidad canguro cuando esté indicada.','Evitar culpabilizar a la mujer; asegurar alternativas de alimentación seguras cuando correspondan.']),true)}${D('02 · Cuidado neonatal esencial',L(['Demostrar sueño seguro: boca arriba, superficie firme y despejada.','Higiene de manos y cuidado del cordón limpio y seco.','Termorregulación, contacto piel a piel según indicación y cuidado responsivo.','Reconocimiento familiar de signos de peligro, ictericia y cuándo acudir a urgencias.','Promover la participación activa del padre en el cuidado neonatal, cuando sea posible y seguro, respetando la autonomía y las decisiones de la mujer: contacto piel a piel, consuelo, higiene, sueño seguro, reconocimiento de signos de alarma y acompañamiento a controles.','Verificar vacunación, tamizajes y controles.']))}${D('03 · Recuperación de la mujer',L(['Reconocer necesidades de recuperación, dolor, heridas, descanso, hidratación y alimentación.','Enseñar signos de alarma obstétrica y mecanismos para buscar atención.','Promover acompañamiento y relevo efectivo, sin desplazar la autonomía de la mujer.','Facilitar continuidad de controles del puerperio y atención de morbilidades.']))}${D('04 · Salud mental y apoyo psicosocial',L(['Preguntar por bienestar emocional en cada contacto y explorar necesidades de apoyo.','Intervenir con escucha, psicoeducación y movilización de apoyo práctico.','Ante tamizaje positivo, gestionar evaluación diagnóstica, tratamiento y seguimiento.','En autolesión, psicosis o incapacidad para cuidar, activar urgencias y protección.']))}${D('05 · Protección y acceso',L(['Explorar violencia en privado sin confrontar a posibles agresores.','Activar rutas de protección y salud cuando corresponda.','Conectar a programas de alimentación, transporte, afiliación o apoyo social cuando las barreras impiden el cuidado.','Cerrar el circuito: comprobar recepción del servicio y continuidad.']))}<div class="note"><strong>Para profundizar:</strong> consulte la pauta completa (secciones 9.2 y 9.3) para condiciones de aplicación, criterios y orientaciones por dominio.</div>`;
if(stage===4)return `<h3>Fortalecer la agencia de cuidado familiar</h3>${note('El objetivo no es transmitir instrucciones, sino desarrollar habilidades observables y capacidades para reconocer riesgos, decidir, solicitar ayuda y organizar el cuidado con los recursos disponibles.')}${D('Secuencia educativa práctica',`<div class="flow"><div>Explore qué sabe, hace y le preocupa a la familia.</div><div>Reconozca prácticas adecuadas y recursos existentes.</div><div>Priorice una necesidad concreta y su fundamento.</div><div>Demuestre la práctica con respeto.</div><div>Invite a la mujer o al cuidador a realizarla.</div><div>Verifique comprensión con «Muéstreme cómo lo haría».</div><div>Oriente compromisos viables y seguimiento en SIBACOM PLUS.</div></div>`,true)}${D('Corresponsabilidad y autonomía',L(['Definir quién puede relevar a la mujer y apoyar su recuperación y descanso.','Distribuir alimentación, labores domésticas, transporte y acompañamiento.','Promover participación del padre o red elegida sin asumir que toda pareja es apoyo seguro.','Respetar decisiones, condiciones materiales y diversas configuraciones familiares.','El equipo y los servicios conservan su responsabilidad; la familia no reemplaza la atención clínica.']))}${D('Prácticas para demostrar en el hogar',L(['Posición y agarre para lactancia, o alimentación alternativa segura cuando esté indicada.','Espacio y posición de sueño seguro.','Higiene de manos y cuidado del cordón.','Reconocimiento de signos de alarma y simulación de activación de servicios.','Mantenimiento de temperatura y cuidado sensible.']))}<div class="note"><strong>Modalidad de cuidado y PICF:</strong> Los hallazgos maternos, neonatales y familiares contribuyen al análisis sistémico y relacional de la vulnerabilidad y a la selección de la modalidad de cuidado básico o especial con sus tipologías, conforme a criterios territoriales y al juicio profesional. No existe correspondencia automática con los tres niveles de riesgo de este módulo.</div><div class="warning">No registre aquí compromisos, responsables o fechas; incorpórelos directamente al Plan de Cuidado Familiar en SIBACOM PLUS.</div>`;

const understand=[
['La familia y la díada son unidades relacionadas de cuidado: no basta revisar antecedentes aislados.','Una complicación del parto puede afectar la recuperación materna, la alimentación y el reparto de tareas en el hogar.','La información ausente también es un riesgo para la continuidad: buscar resultados, egreso, rutas y remisiones.','La pobreza, ruralidad y edad de la madre no son por sí solas negligencia; identifique riesgos concretos y apoyos disponibles.'],
['La valoración es escalonada y multimodal; no existe una puntuación universal de riesgo de la díada.','El estado de la mujer, el recién nacido y la capacidad de cuidado familiar son interdependientes.','Observe lo que efectivamente ocurre: una toma, el sueño, el vínculo y los apoyos, además de preguntar.','Los instrumentos de tamización apoyan la valoración, pero un resultado negativo no neutraliza signos de alarma o preocupación clínica.','El entorno, acceso y transporte pueden agravar una alteración aparentemente moderada.'],
['La gravedad manda: una señal crítica prevalece sobre las demás dimensiones, aunque todo lo restante sea normal.','Diferencie evaluación de urgencia de cuidado programado y verifique que la remisión fue atendida.','No atribuya a una familia desprotección sin valorar daño, amenaza, posibilidades reales y barreras de acceso.','Las señales de alarma pueden cambiar entre contactos: actualice la valoración.'],
['Una visita domiciliaria no es eficaz solamente por ocurrir: debe integrar valoración, demostración, intervención y continuidad.','Las intervenciones de lactancia deben incluir observación y apoyo práctico, no solo mensajes generales.','La mujer decide sobre su cuerpo y su cuidado. Apoyo no equivale a presión ni a culpabilizar por dificultades de lactancia.','Una dificultad de alimentación con letargia, pérdida de peso o deterioro no es solo un problema educativo.'],
['Agencia no significa transferir a la familia todas las responsabilidades clínicas y sociales.','La enseñanza se verifica observando una práctica: saber describirla no implica saber ejecutarla.','El pensamiento sistémico exige ver cómo se distribuyen tareas, se negocian decisiones y se movilizan redes.','Los compromisos deben ser viables, negociados y respetuosos de la autonomía de la mujer.'],
['La continuidad se mide en acceso efectivo a atención y mejora del cuidado, no solo en visitas realizadas.','El acompañamiento remoto complementa, pero no sustituye, el presencial cuando se necesita examinar u observar.','Las remisiones deben tener retorno de información; el equipo verifica el cierre de la ruta.','El PICF y SIBACOM PLUS concentran el registro institucional; evitar documentación paralela ahorra tiempo.']
];
function comprender(){return `<h3>Claves para comprender y decidir</h3><div class="note">La pestaña ofrece criterios de interpretación clínica, familiar y relacional. Para ejecutar una acción, regrese a «Aplicar».</div><ul class="keys">${understand[stage].map(x=>`<li>${x}</li>`).join('')}</ul><p class="tiny">Claves derivadas de las pautas generales y de las secciones 9.1 a 9.4 del documento técnico.</p>`}
const refs=[['9.1 · Valoración integral y riesgo','64–72'],['9.1 · Instrumentos y valoración','64–72'],['9.1 y 9.3 · Alarmas y rutas','64–72; 76–82'],['9.2 y 9.3 · Intervenciones y seguridad','72–82'],['9.4 · Agencia de cuidado','82–86'],['9.4 · Continuidad y seguimiento','82–86']];
function evidencia(){let [title,p]=refs[stage];return `<h3>Documento de referencia</h3><p><strong>Pautas de cuidado basadas en la evidencia para familias con recién nacidos y mujeres en posparto en el entorno hogar.</strong></p><p>El documento presenta la justificación, la síntesis de evidencia y las recomendaciones del recorrido.</p><div class="tile"><strong>Sección relacionada</strong><p>${title}</p><p class="tiny">Páginas impresas de la pauta: ${p}</p></div><p><a class="refbtn" href="Pautas RN y posparto Final(1).pdf" target="_blank" rel="noopener">Consultar pautas completas (PDF) ↗</a></p><p class="tiny">El acceso definitivo al PDF será configurado por el equipo de IT. Para la consulta local, mantenga el documento en la misma carpeta que este HTML.</p><div class="note">La Ruta Materno-Perinatal, los procedimientos institucionales y el juicio profesional prevalecen ante emergencias y definiciones de tratamiento.</div>`}
function render(){document.querySelector('#steps').innerHTML=stages.map(([short],i)=>`<button class="step ${i===stage?'active':''}" data-stage="${i}"><span>${i+1}</span>${short}</button>`).join('');document.querySelector('#stageNum').textContent=`ETAPA ${stage+1} DE 6`;document.querySelector('#stageTitle').textContent=stages[stage][1];document.querySelector('#stageDesc').textContent=stages[stage][2];document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===mode));let s=document.querySelector('#subtabs');s.hidden=!(mode==='aplicar'&&(stage===0||stage===1));document.querySelectorAll('.subtab').forEach(x=>x.classList.toggle('active',x.dataset.sub===sub));document.querySelector('#content').innerHTML=mode==='aplicar'?aplicar():mode==='comprender'?comprender():evidencia();document.querySelector('#prev').disabled=stage===0;document.querySelector('#next').disabled=stage===5;if(stage===1&&mode==='aplicar'&&sub==='hogar'){updateObs();phq9Result();}if(stage===2&&mode==='aplicar'){const r=document.querySelector('#risk');if(r)r.value=risk;updateRisk();}}
function updateRisk(){let el=document.querySelector('#riskResult');if(!el)return;const signs=[...checked].some(x=>x.startsWith('redrn-')||x.startsWith('redmom-')||x.startsWith('redenv-'));let v=risk;if(signs&&v!=='critico'){el.className='danger';el.innerHTML='<strong>Se seleccionaron signos potencialmente críticos.</strong> Interrumpa valoración ordinaria, evalúe gravedad y active la ruta correspondiente; una selección de riesgo habitual o alto no anula estas señales.';}else{el.className='note';el.textContent=v==='critico'?'Activación inmediata y comunicación con servicio receptor.':v==='alto'?'Intensificar visitas, respuesta interdisciplinaria y verificar remisiones.':v==='habitual'?'Continuar controles, educación y revaloración en cada contacto.':'El hallazgo más grave debe orientar la clasificación.'}}
function updateNumbers(){let sb=document.querySelector('#sbp'),db=document.querySelector('#dbp'),bp=document.querySelector('#bpResult');if(sb&&db&&bp){let a=Number(sb.value),b=Number(db.value);bp.className='note tiny';bp.innerHTML=sb.value&&db.value?(a>=160||b>=110?'<strong>Alerta hipertensiva grave:</strong> activar atención inmediata (≥160/110 mmHg, por cualquiera de los componentes).':a>=140||b>=90?'<strong>PA elevada:</strong> confirmar según procedimiento y gestionar valoración médica el mismo día; si hay síntomas de alarma, urgencias.':'Valores inferiores a 140/90; no descartan complicación si existen síntomas.'):'Ingrese ambas cifras si corresponde.';if(sb.value&&db.value&&(a>=140||b>=90))bp.className='warning'}let rr=document.querySelector('#rr'),tmp=document.querySelector('#temp'),o=document.querySelector('#babyResult');if(rr&&tmp&&o){let danger=(rr.value&&Number(rr.value)>60)||(tmp.value&&(Number(tmp.value)>37.5||Number(tmp.value)<35.5));o.className=danger?'danger':'note tiny';o.textContent=danger?'Signo de peligro neonatal: requiere evaluación y remisión clínica inmediata según gravedad.':'La normalidad de estas mediciones no descarta otros signos de peligro.'}}
document.addEventListener('click',e=>{const st=e.target.closest('[data-stage]');if(st){stage=Number(st.dataset.stage);sub=stage===0?'antes':'hogar';render();window.scrollTo({top:0,behavior:'smooth'})}const tab=e.target.closest('[data-tab]');if(tab){mode=tab.dataset.tab;render()}const sb=e.target.closest('[data-sub]');if(sb){sub=sb.dataset.sub;render()}if(e.target.id==='next'){stage=Math.min(5,stage+1);sub='hogar';render();window.scrollTo({top:0,behavior:'smooth'})}if(e.target.id==='prev'){stage=Math.max(0,stage-1);sub='hogar';render();window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('change',e=>{if(e.target.dataset.ck){e.target.checked?checked.add(e.target.dataset.ck):checked.delete(e.target.dataset.ck);updateRisk()}if(e.target.id==='risk'){risk=e.target.value;updateRisk()}});
document.addEventListener('input',e=>{if(['sbp','dbp','rr','temp'].includes(e.target.id))updateNumbers();if(e.target.dataset.obs){obsValues[e.target.dataset.obs]=e.target.value;updateObs();}});
document.addEventListener('change',e=>{if(e.target.dataset.obs){obsValues[e.target.dataset.obs]=e.target.value;updateObs();}if(e.target.dataset.phq9!==undefined){phq9Values[Number(e.target.dataset.phq9)]=e.target.value;phq9Result();}if(e.target.dataset.phq9Impact!==undefined){phq9Impact=e.target.value;}});render();
</script></body></html>
